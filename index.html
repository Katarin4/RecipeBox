<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Box — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFE7D3;
  --paper-dark:#E4D9BE;
  --card:#FFFDF6;
  --ink:#2B2118;
  --ink-soft:#6B5D48;
  --ink-faint:#9C8F76;
  --green:#3F5B41;
  --green-dark:#2C4230;
  --green-tint:#DEE7DA;
  --mustard:#B87F26;
  --mustard-tint:#F1DFB0;
  --brick:#A6432E;
  --brick-tint:#F3DDD5;
  --line:#D9CBA5;
  --radius:10px;
  --shadow:0 1px 0 rgba(43,33,24,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(43,33,24,0.05) 1px, transparent 0);
  background-size:14px 14px;
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;letter-spacing:0.02em;}
a{color:inherit;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
input,textarea,select{font-family:'Inter',sans-serif;}

/* ---------- shell ---------- */
#shell{display:flex;max-width:1180px;margin:0 auto;min-height:100vh;}
#tabs{
  width:200px;flex-shrink:0;padding:30px 14px 28px 22px;position:sticky;top:0;align-self:flex-start;
  border-right:1px solid var(--line);
  min-height:100vh;
}
.brand{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--green-dark);margin:0 0 30px 2px;}
.brand span{color:var(--mustard);}
.tab{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;
  margin:0 -10px 2px;
  border-radius:7px;
  font-size:13.5px;
  color:var(--ink-soft);
  border-left:3px solid transparent;
  transition:background .12s ease, color .12s ease;
  cursor:pointer;
}
.tab .dash{width:12px;height:1px;background:var(--ink-faint);flex-shrink:0;transition:width .12s ease, background .12s ease;}
.tab:hover{background:var(--paper-dark);color:var(--ink);}
.tab.active{
  color:var(--green-dark);
  font-weight:600;
  background:var(--green-tint);
}
.tab.active .dash{width:18px;background:var(--mustard);}
#viewer-switch{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);}
#viewer-switch p{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-faint);margin:0 0 6px;}
#viewer-switch select{width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-size:12.5px;color:var(--ink);}

#main{flex:1;padding:0 34px 60px;min-width:0;}
#main.padded{padding-top:28px;}

/* ---------- generic bits ---------- */
.pagehead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.pagehead h1{font-size:26px;margin:0;}
.pagehead p{margin:2px 0 0;color:var(--ink-soft);font-size:13.5px;}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--card);
  padding:9px 15px;border-radius:7px;font-size:13.5px;font-weight:500;
  transition:opacity .12s;
}
.btn:hover{opacity:0.85;}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line);}
.btn.secondary:hover{background:var(--card);}
.btn.danger{background:var(--brick);border-color:var(--brick);}
.btn.small{padding:6px 11px;font-size:12.5px;border-radius:6px;}
.btn:disabled{opacity:0.4;cursor:default;}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.pad{padding:18px 20px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}

.rcard{
  background:var(--card);border:1px solid var(--line);border-radius:2px 2px 10px 10px;
  position:relative;overflow:hidden;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;
  box-shadow:var(--shadow);
}
.rcard:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(43,33,24,0.12);}
.rcard .snip{
  height:5px;
  background-image:repeating-linear-gradient(90deg, var(--paper-dark) 0 6px, transparent 0 10px);
}
.rcard .thumb{
  height:110px;display:flex;align-items:center;justify-content:center;font-size:42px;
}
.rcard .body{padding:12px 14px 14px;}
.rcard h3{font-size:16px;margin:0 0 4px;}
.rcard .meta{font-size:11.5px;color:var(--ink-soft);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.rcard .taglist{display:flex;flex-wrap:wrap;gap:5px;}
.tagchip{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 7px;border-radius:20px;
  background:var(--mustard-tint);color:#6E4A14;
}
.tagchip.on{background:var(--green);color:#F6F2E4;}
.tagchip.btn-tag{cursor:pointer;border:none;}
.badge{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 6px;border-radius:4px;background:var(--green-tint);color:var(--green-dark);}
.badge.private{background:var(--brick-tint);color:var(--brick);}
.stars{color:var(--mustard);font-size:13px;letter-spacing:1px;}
.empty{padding:40px 20px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:10px;}
.empty h3{margin:0 0 6px;color:var(--ink);}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:5px;}
.field input[type=text],.field input[type=number],.field textarea,.field select{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:14px;color:var(--ink);
}
.field textarea{resize:vertical;min-height:64px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.dyn-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.dyn-row input{flex:1;}
.iconbtn{background:none;border:1px solid var(--line);border-radius:6px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--brick);flex-shrink:0;}
.taginput{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid var(--line);border-radius:7px;background:#fff;}
.taginput input{border:none;outline:none;flex:1;min-width:100px;font-size:13px;}
.chiprm{margin-left:5px;cursor:pointer;font-weight:700;}

.searchbar{display:flex;gap:8px;margin-bottom:16px;}
.searchbar input{flex:1;padding:10px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;}
.filterbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.filterbar select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12.5px;}

.home-hero{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 20px;
}
.home-eyebrow{font-size:12px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.12em;margin:0 0 14px;}
.home-q{font-size:56px;line-height:1.08;margin:0 0 34px;color:var(--ink);}
.home-search{display:flex;gap:8px;width:100%;max-width:460px;margin-bottom:26px;}
.home-search input{flex:1;padding:13px 16px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:15px;box-shadow:var(--shadow);}
.home-pills{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:520px;}
.home-pill{
  padding:10px 16px;border-radius:30px;border:1px solid var(--line);background:var(--card);
  font-size:13.5px;color:var(--ink-soft);cursor:pointer;transition:transform .1s ease, background .1s ease;
}
.home-pill:hover{transform:translateY(-1px);background:var(--paper-dark);color:var(--ink);}
.home-pill.accent{background:var(--green);border-color:var(--green);color:#F6F2E4;}
.home-pill.accent:hover{background:var(--green-dark);}
.hero{
  background:var(--green);color:#F5F1E2;border-radius:14px;padding:34px 30px;margin-bottom:26px;position:relative;overflow:hidden;
}
.hero h1{font-size:30px;margin:0 0 6px;color:#F5F1E2;}
.hero p{margin:0 0 18px;color:#DCE3D5;font-size:14px;}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;}
.hero .btn{background:var(--mustard);border-color:var(--mustard);color:#3A2A08;}
.hero .btn.secondary{background:transparent;border-color:rgba(245,241,226,0.5);color:#F5F1E2;}

.detail-top{display:grid;grid-template-columns:230px 1fr;gap:24px;margin-bottom:24px;}
.detail-thumb{height:230px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:76px;}
.author-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin:6px 0 14px;}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--mustard-tint);color:#6E4A14;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;font-family:'IBM Plex Mono',monospace;}
.avatar.lg{width:64px;height:64px;font-size:20px;}
.stat-row{display:flex;gap:16px;font-size:13px;color:var(--ink-soft);}
.stat-row b{color:var(--ink);font-weight:600;}
.tabsrow{display:flex;gap:4px;margin:20px 0 14px;border-bottom:1px solid var(--line);}
.tabsrow button{background:none;border:none;padding:9px 4px;margin-right:18px;font-size:13.5px;color:var(--ink-soft);border-bottom:2px solid transparent;}
.tabsrow button.active{color:var(--green-dark);border-color:var(--green);font-weight:600;}
.step{display:flex;gap:12px;margin-bottom:14px;}
.stepnum{width:26px;height:26px;border-radius:50%;background:var(--green-tint);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;font-family:'IBM Plex Mono',monospace;}
.ing-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;}
.ing-row:last-child{border-bottom:none;}
.servings-ctrl{display:flex;align-items:center;gap:10px;margin:10px 0 6px;}
.servings-ctrl button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:15px;}
.comment{padding:12px 0;border-bottom:1px solid var(--line);}
.comment:last-child{border-bottom:none;}
.comment .head{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
.rate-picker span{cursor:pointer;font-size:22px;color:var(--line);}
.rate-picker span.on{color:var(--mustard);}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--card);padding:10px 18px;border-radius:8px;font-size:13px;
  opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.ghostnote{font-size:12px;color:var(--ink-faint);margin-top:2px;}
.collectionpill{display:inline-flex;align-items:center;gap:5px;background:var(--paper-dark);padding:5px 10px;border-radius:20px;font-size:12px;margin:0 6px 6px 0;cursor:pointer;}
.collectionpill.on{background:var(--green);color:#fff;}
.followbtn.following{background:transparent;color:var(--green-dark);border-color:var(--green);}
.modal-overlay{
  position:fixed;inset:0;background:rgba(43,33,24,0.45);display:none;
  align-items:center;justify-content:center;z-index:60;padding:20px;
}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--card);border-radius:12px;padding:22px 24px;max-width:380px;width:100%;box-shadow:0 12px 30px rgba(43,33,24,0.25);}
.modal-box h3{margin:0 0 10px;font-size:17px;}
.modal-box p{font-size:13.5px;color:var(--ink-soft);margin:0 0 14px;}
.modal-box input[type=text]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;margin-bottom:14px;font-size:14px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;}
.modal-list button{display:block;width:100%;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;margin-bottom:7px;font-size:13.5px;}
.modal-list button:hover{background:var(--paper-dark);}
@media print{
  #tabs, .pagehead .btn, .tabsrow, .hero, .no-print{display:none !important;}
  #main{padding:0;}
  body{background:#fff;}
}
</style>
</head>
<body>
<div id="shell">
  <div id="tabs">
    <p class="brand">Recipe <span>Box</span></p>
    <div id="tablist"></div>
    <div id="viewer-switch">
      <p>Viewing as (demo)</p>
      <select id="userSwitch"></select>
    </div>
  </div>
  <div id="main"></div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>

<script>
/* ============ MOCK DATA ============ */
let currentUser = 'u1';

const users = {
  u1:{id:'u1',username:'mira.k',bio:'Home cook. Mostly one-pot dinners and too many pickled things.',following:['u2'],followers:['u2']},
  u2:{id:'u2',username:'jovan.petrovic',bio:'Weekend baker. Slowly working through my grandmother\'s notebook.',following:['u1'],followers:['u1']},
};

let nextId = 100;
const uid = (p)=> p+(nextId++);

let recipes = [
  {id:'r1',title:'Riblja pašteta',emoji:'🐟',authorId:'u1',category:'Appetizer',prepTime:15,cookTime:0,difficulty:'Easy',servingsBase:4,
   description:'A quick fish pâté for lazy Sunday breakfasts — good on warm bread with a squeeze of lemon.',
   ingredients:[{qty:200,unit:'g',name:'canned mackerel, drained'},{qty:100,unit:'g',name:'cream cheese'},{qty:1,unit:'',name:'lemon, juiced'},{qty:1,unit:'tbsp',name:'capers, chopped'},{qty:0,unit:'',name:'black pepper, to taste'}],
   steps:['Mash the mackerel with a fork until mostly smooth.','Mix in the cream cheese and lemon juice until combined.','Fold in the capers and season with pepper.','Chill for 20 minutes before serving.'],
   tags:['meatless','breakfast','fish','quick'],visibility:'SHARED',
   ratings:{u2:5},comments:[{authorId:'u2',text:'Made this Sunday, disappeared in ten minutes.',time:'2 days ago'}],createdAt:'2026-07-02'},
  {id:'r2',title:'Sunday slow-roast chicken',emoji:'🍗',authorId:'u1',category:'Dinner',prepTime:20,cookTime:90,difficulty:'Medium',servingsBase:4,
   description:'The one recipe I actually trust myself with. Crisp skin, falls off the bone.',
   ingredients:[{qty:1.6,unit:'kg',name:'whole chicken'},{qty:2,unit:'tbsp',name:'olive oil'},{qty:4,unit:'',name:'garlic cloves'},{qty:1,unit:'',name:'lemon, halved'},{qty:1,unit:'tsp',name:'salt'},{qty:400,unit:'g',name:'potatoes, quartered'}],
   steps:['Preheat the oven to 200°C.','Rub the chicken all over with oil, salt and crushed garlic.','Stuff the cavity with the lemon halves.','Arrange the potatoes around the chicken in a roasting tray.','Roast for about 90 minutes, basting once halfway through.','Rest for 10 minutes before carving.'],
   tags:['dinner','comfort-food','sunday'],visibility:'PRIVATE',
   ratings:{},comments:[],createdAt:'2026-06-18'},
  {id:'r3',title:'Grandmother\'s walnut roll (Potica)',emoji:'🍰',authorId:'u2',category:'Dessert',prepTime:45,cookTime:50,difficulty:'Hard',servingsBase:12,
   description:'Yeasted dough rolled around a sweet walnut filling. Takes a full afternoon, worth every minute.',
   ingredients:[{qty:500,unit:'g',name:'flour'},{qty:250,unit:'ml',name:'warm milk'},{qty:100,unit:'g',name:'sugar'},{qty:80,unit:'g',name:'butter, melted'},{qty:2,unit:'',name:'egg yolks'},{qty:21,unit:'g',name:'fresh yeast'},{qty:400,unit:'g',name:'ground walnuts'},{qty:150,unit:'ml',name:'milk, for filling'}],
   steps:['Proof the yeast in warm milk with a pinch of sugar for 10 minutes.','Combine flour, sugar, butter, egg yolks and the yeast mixture into a soft dough.','Knead for 10 minutes, then let rise for 1 hour.','Simmer the walnuts with milk and remaining sugar to make the filling.','Roll the dough out thin, spread the filling, and roll tightly.','Place in a greased pan, prove for 30 minutes, then bake at 180°C for 50 minutes.'],
   tags:['dessert','baking','family-recipe'],visibility:'SHARED',
   ratings:{u1:4},comments:[{authorId:'u1',text:'This is basically the reason I keep following you.',time:'1 week ago'}],createdAt:'2026-05-30'},
  {id:'r4',title:'Weeknight lentil soup',emoji:'🍲',authorId:'u2',category:'Lunch',prepTime:10,cookTime:30,difficulty:'Easy',servingsBase:3,
   description:'Pantry staples, one pot, done before you finish setting the table.',
   ingredients:[{qty:200,unit:'g',name:'red lentils'},{qty:1,unit:'',name:'onion, diced'},{qty:2,unit:'',name:'carrots, diced'},{qty:1,unit:'tsp',name:'cumin'},{qty:1,unit:'l',name:'vegetable stock'},{qty:1,unit:'tbsp',name:'olive oil'}],
   steps:['Sauté the onion and carrot in olive oil until soft.','Stir in the cumin and cook for 30 seconds.','Add the lentils and stock, bring to a boil.','Simmer for 25 minutes until the lentils fall apart.','Blend partially if you like it smoother, season and serve.'],
   tags:['meatless','quick','one-pot','vegetarian'],visibility:'SHARED',
   ratings:{},comments:[],createdAt:'2026-07-20'},
  {id:'r5',title:'Blitva sa krompirom',emoji:'🥬',authorId:'u1',category:'Dinner',prepTime:10,cookTime:20,difficulty:'Easy',servingsBase:2,
   description:'Swiss chard and potatoes, the way my neighbour taught me. Meatless but never boring.',
   ingredients:[{qty:400,unit:'g',name:'swiss chard'},{qty:3,unit:'',name:'potatoes, cubed'},{qty:3,unit:'',name:'garlic cloves'},{qty:3,unit:'tbsp',name:'olive oil'}],
   steps:['Boil the potatoes until just tender.','Blanch the chard for 2 minutes, then drain.','Fry the garlic gently in olive oil until fragrant.','Combine everything in the pot and toss over low heat for a few minutes.'],
   tags:['meatless','quick','vegetarian','gluten-free'],visibility:'PRIVATE',
   ratings:{},comments:[],createdAt:'2026-07-28'},
];

let collections = [
  {id:'c1',ownerId:'u1',name:'To try',recipeIds:['r3','r4']},
  {id:'c2',ownerId:'u1',name:'Sunday dinners',recipeIds:['r2']},
];

let saved = {u1:['r3','r4'],u2:['r1']};

/* ============ STATE ============ */
let view = {name:'home'};

/* ============ HELPERS ============ */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>t.classList.remove('show'),2200);
}
function me(){return users[currentUser];}
function userRecipes(uid){return recipes.filter(r=>r.authorId===uid);}
function accessible(r, forUser){
  if(r.authorId===forUser) return true;
  if(r.visibility==='SHARED' && users[forUser].following.includes(r.authorId)) return true;
  return false;
}
function accessibleRecipes(forUser){return recipes.filter(r=>accessible(r,forUser));}
function avgRating(r){
  const vals=Object.values(r.ratings);
  if(!vals.length) return null;
  return (vals.reduce((a,b)=>a+b,0)/vals.length);
}
function starString(avg){
  if(avg===null) return '<span style="color:var(--ink-faint);font-size:12px;">no ratings yet</span>';
  const full=Math.round(avg);
  return '<span class="stars">'+('★'.repeat(full))+('☆'.repeat(5-full))+'</span> <span style="color:var(--ink-soft);font-size:12px;">'+avg.toFixed(1)+'</span>';
}
function allTagsFor(list){
  const s=new Set();list.forEach(r=>r.tags.forEach(t=>s.add(t)));return [...s].sort();
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ---- lightweight modal (no window.prompt/confirm — those are blocked in sandboxed views) ---- */
function openModal(html,wireFn){
  document.getElementById('modalBox').innerHTML=html;
  document.getElementById('modalOverlay').classList.add('show');
  if(wireFn) wireFn();
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');}
document.getElementById('modalOverlay') && (document.getElementById('modalOverlay').onclick=(e)=>{ if(e.target.id==='modalOverlay') closeModal(); });

function confirmModal(title,body,onConfirm){
  openModal(`<h3>${title}</h3><p>${body}</p>
    <div class="modal-actions">
      <button class="btn secondary small" id="mCancel">Cancel</button>
      <button class="btn danger small" id="mConfirm">Delete</button>
    </div>`, ()=>{
      document.getElementById('mCancel').onclick=closeModal;
      document.getElementById('mConfirm').onclick=()=>{ closeModal(); onConfirm(); };
    });
}
function promptModal(title,placeholder,onSubmit){
  openModal(`<h3>${title}</h3>
    <input type="text" id="mInput" placeholder="${placeholder}">
    <div class="modal-actions">
      <button class="btn secondary small" id="mCancel">Cancel</button>
      <button class="btn small" id="mSubmit">Create</button>
    </div>`, ()=>{
      const inp=document.getElementById('mInput'); inp.focus();
      document.getElementById('mCancel').onclick=closeModal;
      const submit=()=>{ const v=inp.value.trim(); if(!v) return; closeModal(); onSubmit(v); };
      document.getElementById('mSubmit').onclick=submit;
      inp.onkeydown=(e)=>{ if(e.key==='Enter') submit(); };
    });
}
function pickModal(title,items,emptyLabel,onPick){
  const rows = items.length? items.map((it,i)=>`<button data-pick="${i}">${esc(it.label)}</button>`).join('') : `<p>${emptyLabel}</p>`;
  openModal(`<h3>${title}</h3><div class="modal-list">${rows}</div>
    <div class="modal-actions"><button class="btn secondary small" id="mCancel">Close</button></div>`, ()=>{
      document.getElementById('mCancel').onclick=closeModal;
      document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ closeModal(); onPick(items[parseInt(b.dataset.pick)]); });
    });
}

/* ============ NAV / TABS ============ */
const TABS = [
  {id:'home',label:'Home'},
  {id:'myrecipes',label:'My recipes'},
  {id:'browse',label:'Search & browse'},
  {id:'saved',label:'Saved'},
  {id:'collections',label:'Collections'},
  {id:'ai',label:'Ask for ideas'},
  {id:'profile',label:'My profile'},
];
function renderTabs(){
  const el=document.getElementById('tablist');
  el.innerHTML=TABS.map(t=>
    `<div class="tab ${view.name===t.id?'active':''}" data-nav="${t.id}"><span class="dash"></span>${t.label}</div>`
  ).join('');
  el.querySelectorAll('[data-nav]').forEach(n=>n.onclick=()=>{go(n.dataset.nav)});

  const sw=document.getElementById('userSwitch');
  sw.innerHTML=Object.values(users).map(u=>`<option value="${u.id}" ${u.id===currentUser?'selected':''}>${u.username}</option>`).join('');
  sw.onchange=()=>{currentUser=sw.value;go('home');toast('Switched to '+me().username);};
}
function go(name,params){
  view={name,...(params||{})};
  render();
  window.scrollTo(0,0);
}

/* ============ RENDER ROOT ============ */
function render(){
  renderTabs();
  const m=document.getElementById('main');
  m.classList.toggle('padded', view.name!=='home');
  if(view.name==='home') m.innerHTML=Home();
  else if(view.name==='myrecipes') m.innerHTML=MyRecipes();
  else if(view.name==='browse') m.innerHTML=Browse();
  else if(view.name==='saved') m.innerHTML=Saved();
  else if(view.name==='collections') m.innerHTML=Collections();
  else if(view.name==='collectionDetail') m.innerHTML=CollectionDetail(view.id);
  else if(view.name==='ai') m.innerHTML=AiView();
  else if(view.name==='profile') m.innerHTML=Profile(view.id||currentUser);
  else if(view.name==='followList') m.innerHTML=FollowList(view.id,view.kind);
  else if(view.name==='recipeDetail') m.innerHTML=RecipeDetail(view.id);
  else if(view.name==='recipeForm') m.innerHTML=RecipeForm(view.id||null);
  wireCommon();
}

/* ============ RECIPE CARD ============ */
function recipeCard(r){
  const av=avgRating(r);
  return `<div class="rcard" data-open="${r.id}">
    <div class="snip"></div>
    <div class="thumb" style="background:${tagColor(r.category)}">${r.emoji}</div>
    <div class="body">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px;">
        <h3>${esc(r.title)}</h3>

      </div>
      <div class="meta"><span>${r.category}</span><span>·</span><span>${r.prepTime+r.cookTime} min</span><span>·</span><span>${r.difficulty}</span></div>
      <div style="margin-bottom:8px;">${starString(av)}</div>

function tagColor(cat){
  const m={Appetizer:'#EFE2C9',Dinner:'#E4E9DC',Dessert:'#F3E1E6',Lunch:'#DCEAE2',Breakfast:'#F1E7D2',Snack:'#E7E2EF'};

}

function Home(){
  return `
  <div class="home-hero">
    <p class="home-eyebrow mono">${greeting()}, ${me().username.split('.')[0]}</p>
    <h1 class="home-q">What are we<br>making today?</h1>
    <form id="homeSearchForm" class="home-search">

      <button type="submit" class="btn small">Search</button>
    </form>

function greeting(){
  const h=new Date().getHours();
  if(h<12) return 'Good morning';
  if(h<18) return 'Good afternoon';
  return 'Good evening';
}
function wireHome(){
  const f=document.getElementById('homeSearchForm');
  if(f) f.onsubmit=(e)=>{
    e.preventDefault();
    const q=document.getElementById('homeSearchInput').value;
    go('browse',{q});
  };
  document.querySelectorAll('[data-homepill]').forEach(p=>p.onclick=()=>{
    const kind=p.dataset.homepill;
    go('browse',{cat: kind==='sweet'?'Dessert':'Dinner'});
  });
}
function emptyState(title,body,btnLabel,nav){
  return `<div class="empty"><h3>${title}</h3><p>${body}</p>${btnLabel?`<button class="btn" style="margin-top:10px;" data-nav="${nav}">${btnLabel}</button>`:''}</div>`;
}

/* ============ SAVED ============ */
function Saved(){
  const ids = saved[currentUser]||[];

/* ============ BROWSE / SEARCH ============ */
function Browse(){
  view.q = view.q||'';
  view.cat = view.cat||'';
  view.tags = view.tags||[];
  const pool = accessibleRecipes(currentUser);
  const cats=[...new Set(pool.map(r=>r.category))];
  const tags = allTagsFor(pool);
  let results = pool.filter(r=>{
    if(view.cat && r.category!==view.cat) return false;
    if(view.tags.length && !view.tags.every(t=>r.tags.includes(t))) return false;
    if(view.q){
      const hay=(r.title+' '+r.description+' '+r.ingredients.map(i=>i.name).join(' ')).toLowerCase();
      if(!hay.includes(view.q.toLowerCase())) return false;
    }
    return true;
  });
  return `
  <div class="pagehead"><h1>Search & browse</h1><p></p></div>
  <div class="searchbar">
    <input type="text" id="searchInput" placeholder="Search title, description, or ingredients" value="${esc(view.q)}">
  </div>
  <div class="filterbar">
    <select id="catFilter"><option value="">All categories</option>${cats.map(c=>`<option ${view.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    ${tags.map(t=>`<span class="tagchip btn-tag ${view.tags.includes(t)?'on':''}" data-tag="${t}">${t}</span>`).join('')}
    ${(view.cat||view.tags.length||view.q)?`<button class="btn secondary small" id="clearFilters">Clear filters</button>`:''}
  </div>
  <p style="color:var(--ink-soft);font-size:13px;margin:-4px 0 14px;">${results.length} result${results.length===1?'':'s'}</p>
  ${results.length? `<div class="grid">${results.map(recipeCard).join('')}</div>` : emptyState('No matches','Try removing a filter or a tag.',null,null)}
  `;
}

/* ============ AI (mock) ============ */
function AiView(){
  const mine = userRecipes(currentUser);
  return `
  <div class="pagehead"><h1>Ask for ideas</h1><p>A lightweight prototype assistant — it works from your own book, not a live model.</p></div>
  <div class="card pad" style="max-width:640px;">
    <p style="margin-top:0;color:var(--ink-soft);font-size:13.5px;">Try one:</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
      <button class="btn secondary small" data-ai="dontknow">I don't know what to make</button>
      <button class="btn secondary small" data-ai="side">Suggest a side for chicken</button>
      <button class="btn secondary small" data-ai="similar">Find something like a soup</button>
    </div>
    <div id="aiResult"></div>
  </div>
  `;
}
function aiRespond(kind){
  const mine = userRecipes(currentUser);
  let pick, text;
  if(kind==='dontknow'){
    pick = mine[Math.floor(Math.random()*mine.length)];
    text = pick? `From your own book, how about <b>${esc(pick.title)}</b>? It's ${pick.category.toLowerCase()}, about ${pick.prepTime+pick.cookTime} minutes.` : `Add a few recipes first and I can pull suggestions from your own book.`;
  } else if(kind==='side'){
    const sides = recipes.filter(r=>accessible(r,currentUser)&&['Appetizer','Lunch'].includes(r.category));
    pick = sides[Math.floor(Math.random()*sides.length)];
    text = pick? `<b>${esc(pick.title)}</b> would work well alongside — light, and quick to put together.` : `No obvious sides in your book yet — try adding one tagged "quick".`;
  } else {
    const soups = recipes.filter(r=>accessible(r,currentUser)&&(r.tags.includes('one-pot')||r.title.toLowerCase().includes('soup')));
    pick = soups[0];
    text = pick? `Closest match is <b>${esc(pick.title)}</b>.` : `Nothing soup-like in your book yet.`;
  }
  const el=document.getElementById('aiResult');
  el.innerHTML = `<div class="card pad" style="background:var(--paper-dark);">${text}${pick?`<div style="margin-top:10px;"><button class="btn small" data-open="${pick.id}">Open recipe</button></div>`:''}</div>`;
  wireCommon();
}

/* ============ RECIPE DETAIL ============ */

  view.activeTab = view.activeTab||'ingredients';

  const ratio = view.servings / r.servingsBase;
  const author = users[r.authorId];
  const isAuthor = r.authorId===currentUser;
  const isSaved = (saved[currentUser]||[]).includes(r.id);
  const myRating = r.ratings[currentUser]||0;
  const av = avgRating(r);

  return `
  <p class="mono" style="font-size:11px;color:var(--ink-faint);cursor:pointer;margin-bottom:10px;" data-nav="myrecipes">← Back</p>
  <div class="detail-top">
    <div class="detail-thumb" style="background:${tagColor(r.category)}">${r.emoji}</div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <h1 style="margin:0;">${esc(r.title)}</h1>
        <span class="badge ${r.visibility==='PRIVATE'?'private':''}">${r.visibility==='PRIVATE'?'Private':'Shared'}</span>
      </div>
      <div class="author-row"><div class="avatar">${author.username.slice(0,2).toUpperCase()}</div> by <span data-openprofile="${author.id}" style="text-decoration:underline;cursor:pointer;">${author.username}</span></div>
      <p style="color:var(--ink-soft);font-size:14px;max-width:520px;">${esc(r.description)}</p>
      <div class="meta" style="font-size:12.5px;color:var(--ink-soft);display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;">
        <span>Prep ${r.prepTime}m</span><span>Cook ${r.cookTime}m</span><span>${r.difficulty}</span>
      </div>
      <div style="margin-bottom:10px;">${starString(av)}</div>
      <div class="taglist">${r.tags.map(t=>`<span class="tagchip">${t}</span>`).join('')}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;" class="no-print">
        <button class="btn secondary small" id="saveBtn">${isSaved?'Saved ✓':'Save recipe'}</button>
        <button class="btn secondary small" id="collectBtn">Add to collection</button>
        <button class="btn secondary small" id="pdfBtn">Export PDF</button>
        ${isAuthor? `<button class="btn secondary small" id="shareBtn">${r.visibility==='PRIVATE'?'Make shared':'Make private'}</button>`:''}
        ${isAuthor? `<button class="btn secondary small" data-nav="recipeForm" data-navid="${r.id}">Edit</button>`:''}
        ${isAuthor? `<button class="btn danger small" id="deleteBtn">Delete</button>`:''}
      </div>

    <button data-tab="reviews" class="${view.activeTab==='reviews'?'active':''}">Ratings & comments (${r.comments.length})</button>

  ${view.activeTab==='ingredients' ? `
  <div class="card pad" style="max-width:460px;">
    <div class="servings-ctrl no-print">
      <button id="servMinus">−</button>

/* ============ RECIPE FORM ============ */
let formDraft = null;

    description:'',ingredients:[{qty:1,unit:'',name:''}],steps:[''],tags:[],visibility:'PRIVATE'};
}

    if(editing){

    </div>

    <div class="field"><label>Ingredients</label>

function ingRow(i,idx){
  return `<div class="dyn-row">
    <input type="number" step="0.1" value="${i.qty}" data-ing-qty="${idx}" style="max-width:70px;" placeholder="qty">
    <input type="text" value="${esc(i.unit)}" data-ing-unit="${idx}" style="max-width:70px;" placeholder="unit">
    <input type="text" value="${esc(i.name)}" data-ing-name="${idx}" placeholder="ingredient name">
    <button class="iconbtn" data-rmIng="${idx}">×</button>
  </div>`;
}
function stepRow(s,idx){
  return `<div class="dyn-row">
    <span class="mono" style="width:20px;color:var(--ink-faint);">${idx+1}</span>
    <input type="text" value="${esc(s)}" data-step="${idx}" placeholder="describe this step">
    <button class="iconbtn" data-rmStep="${idx}">×</button>
  </div>`;
}

/* ============ EVENT WIRING ============ */
function wireCommon(){
  document.querySelectorAll('[data-nav]').forEach(n=>{
    n.onclick = ()=>{
      const target=n.dataset.nav;
      if(target==='__newcol'){ createCollection(); return; }
      go(target, n.dataset.navid?{id:n.dataset.navid}:null);
    };
  });
  document.querySelectorAll('[data-open]').forEach(n=>n.onclick=(e)=>{
    if(e.target.closest('[data-nav],[data-follow],button')) {} // allow
    go('recipeDetail',{id:n.dataset.open, activeTab:'ingredients', servings:null});
  });
  document.querySelectorAll('[data-openprofile]').forEach(n=>n.onclick=()=>go('profile',{id:n.dataset.openprofile}));
  document.querySelectorAll('[data-opencol]').forEach(n=>n.onclick=()=>go('collectionDetail',{id:n.dataset.opencol}));
  document.querySelectorAll('[data-follownav]').forEach(n=>n.onclick=()=>go('followList',{id:n.dataset.follownav,kind:n.dataset.kind}));

  const searchInput=document.getElementById('searchInput');
  if(searchInput){ searchInput.oninput=()=>{view.q=searchInput.value; render(); document.getElementById('searchInput').focus(); document.getElementById('searchInput').selectionStart=document.getElementById('searchInput').value.length;}; }
  const catFilter=document.getElementById('catFilter');
  if(catFilter){ catFilter.onchange=()=>{view.cat=catFilter.value; render();}; }
  document.querySelectorAll('[data-tag]').forEach(n=>n.onclick=()=>{
    const t=n.dataset.tag;
    view.tags = view.tags.includes(t)? view.tags.filter(x=>x!==t) : [...view.tags,t];
    render();
  });
  const clearF=document.getElementById('clearFilters');
  if(clearF) clearF.onclick=()=>{view.q='';view.cat='';view.tags=[];render();};

  const newCol=document.getElementById('newCollectionBtn');
  if(newCol) newCol.onclick=createCollection;
  const delCol=document.getElementById('delCollection');
  if(delCol) delCol.onclick=()=>{
    confirmModal('Delete this collection?','The recipes themselves won\'t be affected.',()=>{
      collections = collections.filter(c=>c.id!==view.id);
      toast('Collection deleted'); go('collections');
    });
  };

  document.querySelectorAll('[data-ai]').forEach(n=>n.onclick=()=>aiRespond(n.dataset.ai));
  const followBtn=document.querySelector('[data-follow]');
  if(followBtn) followBtn.onclick=()=>toggleFollow(followBtn.dataset.follow);

  wireRecipeDetail();
  wireRecipeForm();
  wireHome();
}

function createCollection(){
  promptModal('Name this collection','e.g. Sunday dinners',(name)=>{
    const c={id:uid('c'),ownerId:currentUser,name,recipeIds:[]};
    collections.push(c);
    toast('Collection created');
    go('collectionDetail',{id:c.id});
  });
}

function toggleFollow(uidv){
  const u=me();
  if(u.following.includes(uidv)){
    u.following=u.following.filter(x=>x!==uidv);
    users[uidv].followers=users[uidv].followers.filter(x=>x!==currentUser);
    toast('Unfollowed '+users[uidv].username);
  } else {
    u.following.push(uidv);
    users[uidv].followers.push(currentUser);
    toast('Following '+users[uidv].username);
  }
  render();
}

function wireRecipeDetail(){
  document.querySelectorAll('[data-tab]').forEach(n=>n.onclick=()=>{view.activeTab=n.dataset.tab; render();});
  const sm=document.getElementById('servMinus'), sp=document.getElementById('servPlus');
  if(sm) sm.onclick=()=>{ if(view.servings>1){view.servings--; render();} };
  if(sp) sp.onclick=()=>{ view.servings++; render(); };

  const saveBtn=document.getElementById('saveBtn');
  if(saveBtn) saveBtn.onclick=()=>{
    saved[currentUser]=saved[currentUser]||[];
    const list=saved[currentUser];
    const rid=view.id;
    if(list.includes(rid)){ saved[currentUser]=list.filter(x=>x!==rid); toast('Removed from saved'); }
    else { list.push(rid); toast('Saved'); }
    render();
  };
  const collectBtn=document.getElementById('collectBtn');
  if(collectBtn) collectBtn.onclick=()=>{
    const mine=collections.filter(c=>c.ownerId===currentUser);
    const rid=view.id;
    pickModal('Add to which collection?',
      mine.map(c=>({label:c.name+(c.recipeIds.includes(rid)?' ✓ already added':''),id:c.id})),
      'You don\'t have any collections yet — create one from the Collections tab.',
      (item)=>{
        const col=collections.find(c=>c.id===item.id);
        if(!col.recipeIds.includes(rid)) col.recipeIds.push(rid);
        toast('Added to '+col.name);
      });
  };
  const pdfBtn=document.getElementById('pdfBtn');
  if(pdfBtn) pdfBtn.onclick=()=>{ toast('Preparing PDF...'); setTimeout(()=>window.print(),400); };
  const shareBtn=document.getElementById('shareBtn');
  if(shareBtn) shareBtn.onclick=()=>{
    const r=recipes.find(x=>x.id===view.id);
    r.visibility = r.visibility==='PRIVATE'?'SHARED':'PRIVATE';
    toast(r.visibility==='SHARED'?'Recipe is now shared':'Recipe is now private');
    render();
  };
  const delBtn=document.getElementById('deleteBtn');
  if(delBtn) delBtn.onclick=()=>{
    confirmModal('Delete this recipe?','This can\'t be undone.',()=>{
      recipes = recipes.filter(x=>x.id!==view.id);
      toast('Recipe deleted');
      go('myrecipes');
    });
  };
  const ratePicker=document.getElementById('ratePicker');
  if(ratePicker) ratePicker.querySelectorAll('[data-star]').forEach(s=>s.onclick=()=>{
    const r=recipes.find(x=>x.id===view.id);
    r.ratings[currentUser]=parseInt(s.dataset.star);
    toast('Rating saved');
    render();
  });
  const postComment=document.getElementById('postComment');
  if(postComment) postComment.onclick=()=>{
    const inp=document.getElementById('commentInput');
    if(!inp.value.trim()){ toast('Write something first'); return; }
    const r=recipes.find(x=>x.id===view.id);
    r.comments.push({authorId:currentUser,text:inp.value.trim(),time:'just now'});
    toast('Comment posted');
    render();
  };
}

function wireRecipeForm(){
  const saveRecipe=document.getElementById('saveRecipe');
  if(!saveRecipe) return;
  const d = formDraft;

  ['f_title','f_desc','f_cat','f_diff','f_vis','f_prep','f_cook','f_serv'].forEach(id=>{
    const el=document.getElementById(id);
    el.oninput=()=>{
      const map={f_title:'title',f_desc:'description',f_cat:'category',f_diff:'difficulty',f_vis:'visibility',f_prep:'prepTime',f_cook:'cookTime',f_serv:'servingsBase'};
      const key=map[id];
      d[key] = ['f_prep','f_cook','f_serv'].includes(id)? parseInt(el.value)||0 : el.value;
    };
  });

  document.getElementById('addIng').onclick=()=>{ d.ingredients.push({qty:1,unit:'',name:''}); render(); };
  document.querySelectorAll('[data-rmIng]').forEach(b=>b.onclick=()=>{ d.ingredients.splice(parseInt(b.dataset.rming),1); render(); });
  document.querySelectorAll('[data-ing-qty]').forEach(i=>i.oninput=()=>d.ingredients[i.dataset.ingQty].qty=parseFloat(i.value)||0);
  document.querySelectorAll('[data-ing-unit]').forEach(i=>i.oninput=()=>d.ingredients[i.dataset.ingUnit].unit=i.value);
  document.querySelectorAll('[data-ing-name]').forEach(i=>i.oninput=()=>d.ingredients[i.dataset.ingName].name=i.value);

  document.getElementById('addStep').onclick=()=>{ d.steps.push(''); render(); };
  document.querySelectorAll('[data-rmStep]').forEach(b=>b.onclick=()=>{ d.steps.splice(parseInt(b.dataset.rmstep),1); render(); });
  document.querySelectorAll('[data-step]').forEach(i=>i.oninput=()=>d.steps[i.dataset.step]=i.value);

  const tagField=document.getElementById('tagInputField');
  if(tagField) tagField.onkeydown=(e)=>{
    if(e.key==='Enter'){
      e.preventDefault();
      const v=tagField.value.trim().toLowerCase();
      if(v && !d.tags.includes(v)){ d.tags.push(v); render(); }
      else tagField.value='';
    }
  };
  document.querySelectorAll('[data-rmtag]').forEach(x=>x.onclick=()=>{ d.tags.splice(parseInt(x.dataset.rmtag),1); render(); });

  saveRecipe.onclick=()=>{
    const err=document.getElementById('formError');
    if(!d.title.trim()){ err.textContent='Give the recipe a title before saving.'; return; }
    if(!d.ingredients.some(i=>i.name.trim())){ err.textContent='Add at least one ingredient.'; return; }
    if(!d.steps.some(s=>s.trim())){ err.textContent='Add at least one preparation step.'; return; }
    d.ingredients = d.ingredients.filter(i=>i.name.trim());
    d.steps = d.steps.filter(s=>s.trim());
    d.tags = d.tags.filter(t=>t.trim());

    if(d.id){
      const idx=recipes.findIndex(r=>r.id===d.id);
      recipes[idx] = {...recipes[idx], ...d};
      toast('Recipe updated');
      go('recipeDetail',{id:d.id});
    } else {
      const nr = {...d, id:uid('r'), authorId:currentUser, ratings:{}, comments:[], createdAt:'today', emoji: pickEmoji(d.category)};
      recipes.push(nr);
      toast('Recipe added');
      formDraft=null;
      go('recipeDetail',{id:nr.id});
    }
    formDraft=null;
  };
  document.getElementById('cancelForm').onclick=()=>{ formDraft=null; go('myrecipes'); };
}
function pickEmoji(cat){
  const m={Breakfast:'🍳',Lunch:'🥗',Dinner:'🍽️',Dessert:'🍰',Appetizer:'🥄',Snack:'🥨'};
  return m[cat]||'🍽️';
}

/* ============ INIT ============ */
go('home');
</script>
</body>
</html>
